dataset: "IndicTTS_Telugu"
language: "te"

path:
  raw_data_dir: "data/raw/Telugu"
  processed_data_dir: "data/processed/Telugu"
  checkpoint_dir: "checkpoints"
  result_dir: "../Results/Telugu"

model:
  vocab_size: 67
  encoder_hidden: 256
  encoder_layers: 4
  encoder_heads: 2
  decoder_layers: 4
  decoder_heads: 2
  fft_inner_dim: 1024
  n_mel_channels: 80
  max_seq_len: 1000
  pitch_min: 50.0
  pitch_max: 800.0
  energy_min: 0.0
  energy_max: 100.0

audio:
  sampling_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  fmin: 0
  fmax: 8000

training:
  batch_size: 16
  learning_rate: 0.001
  warmup_steps: 2000
  epochs: 40
  grad_clip_thresh: 1.0
  val_step: 100
  save_step: 500

